<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leafbloom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4EEE6;--surface:#F6FAF7;--surface2:#E9F1EB;--ink:#1F3B2C;--muted:#587263;--line:#C6D7CB;
  --water:#2B76C9;--water2:#63A8EE;--on-water:#fff;--sap:#A86E08;--seed:#7A5A2B;--accent:#3E8E4E;--bad:#B4483A;
  --grass1:#9CCB7E;--grass2:#6FA65A;--soil:#5A3F2C;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1913;--surface:#17251D;--surface2:#1D2E24;--ink:#E2EEE5;--muted:#98B2A2;--line:#2A3E32;
  --water:#3E8EE0;--water2:#7AB8F5;--on-water:#fff;--sap:#F2C14E;--seed:#D9B07A;--accent:#6CC07B;--bad:#E07A6B;
  --grass1:#35583A;--grass2:#26452B;--soil:#3A2A1E;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1913;--surface:#17251D;--surface2:#1D2E24;--ink:#E2EEE5;--muted:#98B2A2;--line:#2A3E32;
  --water:#3E8EE0;--water2:#7AB8F5;--on-water:#fff;--sap:#F2C14E;--seed:#D9B07A;--accent:#6CC07B;--bad:#E07A6B;
  --grass1:#35583A;--grass2:#26452B;--soil:#3A2A1E;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Karla,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;min-height:100%}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--water2);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:14px 14px 40px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
h1{font-family:"Bagel Fat One","Arial Black",sans-serif;font-weight:400;font-size:clamp(30px,7vw,42px);margin:0;line-height:1;color:var(--accent)}
.status{font-size:14px;color:var(--muted);text-align:right}
.layout{display:grid;gap:16px}
@media (min-width:900px){.layout{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}
  .hero-col{position:sticky;top:calc(14px + env(safe-area-inset-top,0px))}}
.stage{position:relative;border-radius:26px;overflow:hidden;background:#9FD0F0}
#heroScroll{height:clamp(340px,82vw,540px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
#hero{display:block;position:sticky;top:0;width:100%;height:100%;touch-action:pan-y}
#heroSpacer{height:0}
.jump{position:absolute;top:12px;left:12px;border:0;border-radius:99px;padding:7px 12px;font-weight:700;font-size:13px;background:rgba(255,255,255,.9);color:#1F3B2C;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.jump[hidden]{display:none}
.bars{position:absolute;left:14px;right:14px;bottom:12px;display:grid;gap:5px;pointer-events:none}
.bar{position:relative;height:12px;border-radius:99px;background:rgba(20,40,30,.35);overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:inherit;transition:width .25s linear}
.bar.moist>i{background:linear-gradient(90deg,#5FA5EC,#2B76C9)}
.bar.xp>i{background:linear-gradient(90deg,#B6E07C,#5DAA4C)}
.bar span{position:absolute;inset:0;font-size:10px;font-weight:700;line-height:12px;padding-left:8px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.under{display:flex;align-items:center;gap:14px;margin-top:12px}
.who{flex:1;min-width:0}
.who .pname{font-family:"Bagel Fat One","Arial Black",sans-serif;font-size:26px;line-height:1.05;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .stage-name{color:var(--muted);font-size:14px}
.water{flex:none;width:86px;height:86px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,var(--water2),var(--water) 65%);color:var(--on-water);
  display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 0 rgba(20,60,110,.35);transition:transform .08s}
.water:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(20,60,110,.35)}
.water svg{width:34px;height:34px}
.water b{display:block;font-size:13px;margin-top:-6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.stat small{display:block;color:var(--muted);font-size:13px}
.stat strong{font-size:20px;font-variant-numeric:tabular-nums}
.stat .rate{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sap{color:var(--sap)}.seed{color:var(--seed)}
.tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:16px;border:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;padding:10px 2px;font-size:15px;border-radius:12px;font-weight:700;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;margin-top:10px}
.panel[hidden]{display:none}
.panel h2{font-size:17px;margin:14px 0 8px}
.panel h2:first-child{margin-top:2px}
.note{color:var(--muted);font-size:14px;margin:4px 0 10px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .txt{flex:1;min-width:0}
.row .txt b{font-size:16px}
.row .txt .lv{color:var(--muted);font-size:13px;margin-left:6px}
.row .txt p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.buy{flex:none;min-width:96px;border:2px solid var(--accent);background:transparent;border-radius:12px;padding:8px 10px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.buy:disabled{opacity:.4;cursor:default}
.buy.go{background:var(--accent);color:#fff}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.letters button{position:relative;border-radius:12px;border:2px solid var(--line);background:var(--surface2);cursor:pointer;
  font-size:12px;font-weight:700;line-height:1.1;padding:4px 2px 6px;display:grid;justify-items:center;gap:2px}
.letters canvas{width:44px;height:44px}
.letters button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.letters button.locked{color:var(--muted);opacity:.75}
.letters button small{font-size:11px;color:var(--sap)}
.seg{display:flex;gap:6px;margin-bottom:8px}
.seg button{border:2px solid var(--line);background:var(--surface2);border-radius:99px;padding:5px 12px;font-weight:700;font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.clanhead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.clanhead .badge{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-family:"Bagel Fat One","Arial Black",sans-serif;font-size:24px;color:#fff;flex:none}
.clanhead h2{margin:0!important}
.member{padding:12px 0;border-top:1px solid var(--line)}
.member .lv{color:var(--muted);font-size:13px;margin-left:6px}
.member p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.gifts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.gift{display:flex;flex-direction:column;align-items:center;gap:3px;border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:6px 4px;font-size:12px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.gift.go{border-color:var(--accent);color:var(--ink)}
.gift:disabled{opacity:.55;cursor:default}
.gift canvas{width:30px;height:30px}
.gcard{flex-wrap:wrap}
.linkish[hidden]{display:none!important}
.linkish{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px 0;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface2);border-radius:99px;padding:4px 10px 4px 4px;cursor:pointer;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--accent)}
.chip canvas,.chip .sw{width:28px;height:28px;border-radius:50%;flex:none;background:var(--surface)}
.chip .cost{color:var(--seed);font-weight:700;font-size:12px}
.chip.locked{opacity:.8}
.namefield{display:flex;gap:8px}
.namefield input{flex:1;min-width:0;border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:8px 10px}
.prog{height:14px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#E9C46A,#C98A12)}
.ascend-btn{width:100%;border:0;border-radius:14px;padding:14px;font-weight:700;font-size:17px;cursor:pointer;background:var(--seed);color:#fff}
.ascend-btn:disabled{opacity:.4;cursor:default}
#garden{display:block;width:100%;border-radius:16px;touch-action:manipulation;cursor:pointer}
.gcard{margin-top:10px;padding:12px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);display:flex;gap:12px;align-items:center}
.gcard .txt{flex:1;min-width:0}
.gcard b{font-size:17px}
.gcard p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.gcard .buy{border-color:var(--water);color:var(--water)}
.gcard .buy.go{background:var(--water);color:#fff}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:6px;z-index:20;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:14px;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.2);animation:t .25s ease-out}
@keyframes t{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.bar>i{transition:none}}
.chat{max-height:320px;overflow-y:auto;overscroll-behavior:contain;border:1px solid var(--line);border-radius:14px;background:var(--surface2);padding:8px;display:grid;gap:6px;margin-bottom:8px}
.msg{background:var(--surface);border-radius:12px;padding:6px 10px;max-width:85%;justify-self:start}
.msg.me{justify-self:end;background:var(--accent);color:#fff}
.msg b{display:block;font-size:12px}
.msg span{display:block;overflow-wrap:anywhere}
.msg time{display:block;font-size:11px;opacity:.7;text-align:right}
#treeCv{display:block;width:100%;height:210px;border-radius:14px}
.donate{display:flex;gap:6px;flex-wrap:wrap}
.mutlist{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.mutlist span{border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:13px;background:var(--surface2)}
.mutlist span.no{color:var(--muted);border-style:dashed;background:transparent}
.qmark{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--muted);font-weight:700;font-size:16px}
.hlist{display:grid;gap:8px}
.hrow{display:flex;gap:10px;align-items:center}
.hrow canvas,.hrow .qmark{width:36px;height:36px;flex:none}
.hrow p{margin:0;font-size:13px;color:var(--muted)}
.gifts{grid-template-columns:repeat(3,1fr)}
.on{color:#2E9E45;font-weight:700;white-space:nowrap}
.bgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.bgc{border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:4px;cursor:pointer;display:grid;gap:3px;font-size:13px;font-weight:700;text-align:center}
.bgc canvas{width:100%;aspect-ratio:8/5;border-radius:8px;display:block}
.bgc[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.bgc.locked{opacity:.75}
.bgc small{font-weight:500;color:var(--muted);font-size:11px}
.ach{padding:8px 0;border-top:1px solid var(--line)}
.ach b{font-size:15px}.ach p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.ach.done b{color:var(--accent)}
.prog.small{height:8px;margin:6px 0 2px}
.bottlebox{display:flex;gap:12px;align-items:center;margin-bottom:10px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface2)}
.bottlebox canvas{width:60px;height:120px;flex:none}
.bottlebox .txt{flex:1;min-width:0}.bottlebox p{margin:2px 0 6px;font-size:14px;color:var(--muted)}
.sys{justify-self:center;text-align:center;font-size:13px;color:var(--muted);padding:2px 8px}
.sys time{font-size:11px;opacity:.7;margin-left:4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Leafbloom</h1>
    <div class="status" id="status"><span id="statusTxt">Planting…</span><button class="linkish" id="authBtn" hidden style="display:block;margin-left:auto">Sign in with Google</button></div>
  </header>
  <div class="layout">
    <section class="hero-col">
      <div class="stage">
        <div id="heroScroll"><canvas id="hero" aria-label="Your plant. Scroll to see all of it."></canvas><div id="heroSpacer"></div></div>
        <button class="jump" id="jumpBtn" hidden>Show new growth</button>
        <div class="bars">
          <div class="bar moist"><i id="moistBar"></i><span id="moistTxt">Soil</span></div>
          <div class="bar xp"><i id="xpBar"></i><span id="xpTxt">Growth</span></div>
        </div>
      </div>
      <div class="under">
        <div class="who">
          <div class="pname" id="pname">Sprout</div>
          <div class="stage-name" id="stageName">Seed</div>
        </div>
        <button class="water" id="waterBtn" aria-label="Water your plant">
          <span><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.5c-.4 0-.7.2-.9.5C8.4 7 5.5 10.6 5.5 14.5a6.5 6.5 0 0 0 13 0c0-3.9-2.9-7.5-5.6-11.5a1.1 1.1 0 0 0-.9-.5z"/></svg><b>Water</b></span>
        </button>
      </div>
      <div class="stats">
        <div class="stat"><small>Level</small><strong id="sLevel">1</strong><div class="rate" id="sXpRate"></div></div>
        <div class="stat"><small>Sap</small><strong class="sap" id="sSap">0</strong><div class="rate" id="sSapRate"></div></div>
        <div class="stat"><small>Seeds</small><strong class="seed" id="sSeeds">0</strong><div class="rate" id="sAsc"></div></div>
      </div>
    </section>
    <section>
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="grow" aria-selected="true">Grow</button>
        <button role="tab" data-tab="look" aria-selected="false">Look</button>
        <button role="tab" data-tab="ascend" aria-selected="false">Ascend</button>
        <button role="tab" data-tab="garden" aria-selected="false">Garden</button>
        <button role="tab" data-tab="clan" aria-selected="false">Clan</button>
      </div>
      <div class="panel" id="p-grow" role="tabpanel"></div>
      <div class="panel" id="p-look" role="tabpanel" hidden></div>
      <div class="panel" id="p-ascend" role="tabpanel" hidden></div>
      <div class="panel" id="p-garden" role="tabpanel" hidden>
        <p class="note" id="gardenNote">Everyone’s plants grow here. Tap one to visit it.</p>
        <div class="seg" id="gfilter"><button data-gfilter="all" aria-pressed="true">Everyone</button><button data-gfilter="clan" aria-pressed="false">My clan</button></div>
        <canvas id="garden" aria-label="Shared garden"></canvas>
        <div class="gcard" id="gcard" hidden></div>
      </div>
      <div class="panel" id="p-clan" role="tabpanel" hidden></div>
    </section>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module">// Firebase is loaded on demand in boot(), so the game still runs if it can't load.
const FB='https://www.gstatic.com/firebasejs/10.12.2/';
let fdel,forder,flimit,initializeApp,getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut,getFirestore,fdoc,setDoc,getDoc,fcol,query,fwhere,fsnap;

/* ---------- data ---------- */
const STEMS={
  spring:{name:'Spring',cost:0,dark:'#2E6B2F',light:'#86CC70',edge:'#1E4A22',leaf:['#4FA34A','#6DBB55','#3D8C3F']},
  moss:{name:'Moss',cost:2,dark:'#3B4A1E',light:'#A3B652',edge:'#2A3514',leaf:['#7C9137','#93AC45','#5F7228']},
  teal:{name:'Lagoon',cost:3,dark:'#1D5B5A',light:'#6CCDBA',edge:'#123F3E',leaf:['#3AA393','#53BCA9','#2B8577']},
  autumn:{name:'Autumn',cost:4,dark:'#6B2E1A',light:'#E89A45',edge:'#4A1E10',leaf:['#D9622B','#E8A33D','#B8432A']},
  dusk:{name:'Dusk',cost:5,dark:'#3A2559',light:'#B18BE0',edge:'#24163A',leaf:['#7F5BB5','#9A74CF','#5E418C']},
  frost:{name:'Frost',cost:6,dark:'#3E5C7A',light:'#DDEFF8',edge:'#2B4157',leaf:['#A9CFE6','#C7E3F2','#88B4D1']}
};
/* life = ascensions needed before the leaf can be bought; cost in sap */
const LEAVES={round:{name:'Round',life:0,cost:0},pointed:{name:'Pointed',life:0,cost:0},
  heart:{name:'Heart',life:0,cost:250},fern:{name:'Fern',life:0,cost:400},
  clover:{name:'Clover',life:1,cost:400},willow:{name:'Willow',life:1,cost:600},
  oak:{name:'Oak',life:2,cost:900},holly:{name:'Holly',life:2,cost:1200},
  needle:{name:'Pine',life:3,cost:1500},maple:{name:'Maple',life:3,cost:2100},
  ginkgo:{name:'Ginkgo',life:4,cost:2200},palm:{name:'Palm',life:4,cost:3000},
  monstera:{name:'Monstera',life:5,cost:8000}};
const HELP_CAP=2*3600; /* seconds of your own sap flow you can earn per day by helping others */
const START_LEAVES=['round','pointed'];
const FLOWERS={daisy:{name:'Daisy',cost:0},tulip:{name:'Tulip',cost:4},star:{name:'Starbloom',cost:5},bell:{name:'Bellflower',cost:6},rose:{name:'Rose',cost:9}};
const PETALS={blush:{name:'Blush',cost:0,c:'#F29CB3'},snow:{name:'Snow',cost:2,c:'#FBFBF4'},sun:{name:'Sunny',cost:2,c:'#F5C542'},
  crimson:{name:'Crimson',cost:3,c:'#D93A4A'},sky:{name:'Sky',cost:3,c:'#7DB8F0'},violet:{name:'Violet',cost:4,c:'#B07CE8'}};
const POTS={terracotta:{name:'Clay',cost:0,c:'#B8643E',d:'#94492A'},glazed:{name:'Glazed',cost:2,c:'#2F6DA8',d:'#204F7D'},
  stone:{name:'Stone',cost:2,c:'#8C8A84',d:'#6C6A65'},slate:{name:'Slate',cost:3,c:'#454A54',d:'#2E3239'},gold:{name:'Gold',cost:10,c:'#D4A537',d:'#A57C1C'}};
const COSMETICS={stem:STEMS,flower:FLOWERS,petal:PETALS,pot:POTS};
const COS_TITLES={stem:'Stem and leaf color',flower:'Flowers',petal:'Flower color',pot:'Pot'};
const UPG={
  roots:{name:'Roots',base:8,g:1.55,max:999,eff:l=>`Sap flow ×${1+l}`},
  leaves:{name:'Foliage',base:12,g:1.6,max:999,eff:l=>`Growth ×${(1+0.3*l).toFixed(1)}`},
  res:{name:'Reservoir',base:20,g:1.75,max:15,eff:l=>`A full watering lasts ${(5*(1+0.35*l)).toFixed(1).replace('.0','')} h`},
  bloom:{name:'Bloom',base:60,g:2.1,max:60,eff:l=>`Everything ×${Math.pow(1.12,l).toFixed(2)}, more flowers`}
};
const PERMS={
  fertile:{name:'Fertile soil',max:30,cost:l=>3+2*l,eff:l=>`+${10*l}% growth and sap, forever`},
  rain:{name:'Rain charm',max:5,cost:l=>[4,9,18,35,60][l]||999,eff:l=>l?`Rain adds ${(4.8*l).toFixed(1)} soil per hour`:'Gentle rain waters you while away'},
  deep:{name:'Deep roots',max:5,cost:l=>5*Math.pow(2,l),eff:l=>`Start each life with Roots level ${2*l}`}
};
const PACE=65, WATER_CD=60*60*1000;
/* rare looks a new section can get when you ascend */
const MUTS={variegated:{name:'Variegated',w:5,desc:'cream-striped leaves'},giant:{name:'Giant leaves',w:4,desc:'leaves half again as big'},
  twisted:{name:'Twisted',w:4,desc:'a winding stem'},twin:{name:'Twin bloom',w:3,desc:'two flowers on every tip'},
  golden:{name:'Golden',w:2,desc:'gilded leaves'},crystal:{name:'Crystal',w:2,desc:'glassy see-through leaves'},glow:{name:'Glowing',w:2,desc:'flowers that glow'}};

  leavesBought:0,bg:'meadow',ach:{},stats:{playSecs:0,days:0,lastDay:'',waters:0,helpersSent:0,wateredOthers:0},lastWater:{},dropSeen:{},stock:Object.fromEntries(H_KEYS.map(k=>[k,[]])),stockTs:{},found:{},visitors:[],collected:[],waterCount:0,nightWaters:0,bloomSecs:0,wetSecs:0,clan:null,best:1,tiers:[],help:{day:'',sec:0},mut:null,mutDry:0,mutSeen:[],treeGiven:{}};}
function normalize(s){const d=newState();if(!s||typeof s!=='object')return d;
  const o=Object.assign(d,s);o.up=Object.assign(newState().up,s.up||{});o.perm=Object.assign(newState().perm,s.perm||{});
  o.owned=Object.assign(newState().owned,s.owned||{});for(const k of START_LEAVES)if(!o.owned.leaf.includes(k))o.owned.leaf.push(k);
  o.owned.leaf=o.owned.leaf.filter(k=>has(LEAVES,k));if(!has(LEAVES,o.leaf))o.leaf='round';
  for(const k of ['lastWater','dropSeen'])o[k]=(s[k]&&typeof s[k]==='object')?s[k]:{};
  const obj=v=>(v&&typeof v==='object'&&!Array.isArray(v))?v:{};o.stock={};o.stockTs=obj(s.stockTs);o.found=obj(s.found);
  for(const k of H_KEYS){const a=(s.stock||{})[k];o.stock[k]=Array.isArray(a)?a.map(Boolean).slice(0,STOCK_CAP):[];}
  o.visitors=Array.isArray(s.visitors)?s.visitors.filter(v=>v&&has(HELPERS,v.type)&&isFinite(v.until)).slice(0,8):[];
  o.collected=Array.isArray(s.collected)?s.collected.slice(-80):[];
  for(const k of ['waterCount','nightWaters','bloomSecs','wetSecs'])o[k]=isFinite(s[k])?+s[k]:0;
  o.ach=obj(s.ach);o.stats=Object.assign(newState().stats,obj(s.stats));for(const k of ['playSecs','days','waters','helpersSent','wateredOthers'])if(!isFinite(o.stats[k]))o.stats[k]=0;

  if(typeof o.clan!=='string')o.clan=null;if(!o.help||typeof o.help!=='object'||!isFinite(o.help.sec))o.help={day:'',sec:0};
  if(!has(MUTS,o.mut))o.mut=null;o.mutDry=isFinite(o.mutDry)?o.mutDry:0;o.mutSeen=Array.isArray(o.mutSeen)?o.mutSeen.filter(k=>has(MUTS,k)):[];o.treeGiven=(o.treeGiven&&typeof o.treeGiven==='object')?o.treeGiven:{};

let myId=null,db=null,online=false,myName='';
const sunFactor=ts=>{const h=new Date(ts).getHours();return(h>=6&&h<20)?1:0.6;};
const moistF=m=>m<=0?0.15:0.35+0.65*Math.min(1,m/35);
const need=l=>15*Math.pow(1.17,l-1);
/* what the helpers on a plant do right now */
function helperFx(s,ts){const act={};for(const v of s.visitors||[])if(v.until>ts)(act[v.type]=act[v.type]||[]).push(!!v.rare);
  const sum=k=>{const st=HELPERS[k].steps;return(act[k]||[]).slice().sort((a,b)=>b-a).reduce((acc,r,i)=>acc+st[Math.min(i,st.length-1)]*(r?2:1),0);};

function writer(fn){let busy=false,again=false;const run=async()=>{if(busy){again=true;return;}busy=true;
  try{await fn();}catch(e){dbError(e);}busy=false;if(again){again=false;run();}};return run;}

  else if(c==='quota_exceeded')toast('The garden is full right now. Your plant is saved on this device.');}

/* ---------- plant structure ---------- */
const plantCache=new Map();
function genPlant(id){let P=plantCache.get(id);if(P)return P;const r=rng(hashStr(id+'|plant'));let tips=0,maxBirth=0;
  function chain(n,len,b0,stepB,depth,w,firstAng){let first=null,prev=null,side=r()<0.5?1:-1;
    for(let i=0;i<n;i++){const b=b0+i*stepB;
      const node={len:len*(1-i*0.04)*(0.85+r()*0.3),ang:i===0?firstAng:(r()-0.5)*0.24,w:w*(1-i/(n+3)),birth:b,kids:[],leaves:[],tip:-1,depth};
      maxBirth=Math.max(maxBirth,b+1);
      const nl=depth===0?2:1+(r()<0.5?1:0);
      for(let k=0;k<nl;k++)node.leaves.push({at:0.5+0.45*r(),side:k%2?-side:side,ang:0.7+r()*0.55,birth:b+0.5+k*0.15,sz:0.7+r()*0.5,ci:Math.floor(r()*3)});
      if(depth<2&&i>=(depth===0?2:1)&&i<n-1&&r()<(depth===0?0.8:0.5)){side=-side;
        node.kids.push(chain(depth===0?Math.max(2,4-Math.floor(i/3)):2,len*0.78,b+0.6,0.7,depth+1,node.w*0.6,side*(0.55+r()*0.45)));}
      if(prev)prev.kids.unshift(node);else first=node;prev=node;}
    prev.tip=tips++;
    prev.leaves.push({at:1,side:1,ang:0.35,birth:prev.birth+0.7,sz:0.8,ci:0},{at:1,side:-1,ang:0.35,birth:prev.birth+0.8,sz:0.8,ci:1});
    return first;}
  const root=chain(9,0.105,0,1,0,0.045,0);P={root,maxBirth,tips};plantCache.set(id,P);return P;}

/* ---------- drawing ---------- */
function circ(g,x,y,r){g.moveTo(x+r,y);g.arc(x,y,r,0,Math.PI*2);}
function drawLeaf(g,kind,L,col){if(L<=0.3)return;const W=L*0.42;g.fillStyle=col;g.strokeStyle=col;g.beginPath();const thin=Math.max(1,L*0.06);
  switch(kind){
  case'pointed':g.moveTo(0,0);g.bezierCurveTo(L*.3,-W*1.1,L*.7,-W*.6,L,0);g.bezierCurveTo(L*.7,W*.6,L*.3,W*1.1,0,0);g.fill();break;
  case'fern':g.lineWidth=thin;g.moveTo(0,0);g.lineTo(L,0);g.stroke();
    for(let i=1;i<=5;i++){const x=L*i/6,s=W*(1.05-i*.13);g.beginPath();g.ellipse(x,-s*.55,s*.55,s*.28,-.6,0,7);g.ellipse(x,s*.55,s*.55,s*.28,.6,0,7);g.fill();}return;
  case'heart':circ(g,L*.62,-W*.42,W*.62);circ(g,L*.62,W*.42,W*.62);g.fill();g.beginPath();g.moveTo(0,0);g.lineTo(L*.6,-W);g.lineTo(L*.6,W);g.fill();break;
  case'maple':{const cx=L*.55,R=L*.48,r=L*.22;for(let i=0;i<10;i++){const a=i*Math.PI/5,rr=i%2?r:R;g.lineTo(cx+Math.cos(a)*rr,Math.sin(a)*rr);}g.closePath();g.fill();
    g.beginPath();g.lineWidth=thin;g.moveTo(0,0);g.lineTo(cx,0);g.stroke();return;}
  case'oak':for(let i=0;i<4;i++){const x=L*(.3+i*.2),rad=W*(.62-i*.08);circ(g,x,-rad*.55,rad*.62);circ(g,x,rad*.55,rad*.62);}
    g.ellipse(L*.55,0,L*.45,W*.5,0,0,7);g.fill();g.beginPath();g.lineWidth=thin;g.moveTo(0,0);g.lineTo(L*.2,0);g.stroke();break;
  case'ginkgo':g.lineWidth=thin;g.moveTo(0,0);g.lineTo(L*.32,0);g.stroke();g.beginPath();g.moveTo(L*.3,0);g.arc(L*.3,0,L*.7,-.8,.8);g.closePath();g.fill();
    g.strokeStyle='rgba(0,0,0,.18)';g.lineWidth=Math.max(1,W*.1);g.beginPath();g.moveTo(L*.75,0);g.lineTo(L,0);g.stroke();return;
  case'clover':g.lineWidth=thin;g.moveTo(0,0);g.lineTo(L*.45,0);g.stroke();g.beginPath();
    for(const a of[-1.15,0,1.15])circ(g,L*.45+Math.cos(a)*W*.62,Math.sin(a)*W*.62,W*.6);g.fill();return;
  case'willow':g.moveTo(0,0);g.quadraticCurveTo(L*.7,-W*.45,L*1.5,W*.15);g.quadraticCurveTo(L*.7,W*.35,0,0);g.fill();break;
  case'holly':g.moveTo(0,0);for(let i=1;i<=6;i++){const x=L*i/6;g.lineTo(x-L*.05,-W*Math.sin(Math.PI*i/6)*(i%2?1.25:.75));}
    for(let i=5;i>=0;i--){const x=L*i/6;g.lineTo(x+L*.05,W*Math.sin(Math.PI*i/6)*(i%2?1.25:.75));}g.closePath();g.fill();break;
  case'needle':g.lineWidth=Math.max(1,L*.05);g.lineCap='round';for(let a=-.5;a<=.51;a+=.25){g.moveTo(0,0);g.lineTo(L*Math.cos(a),L*Math.sin(a));}g.stroke();return;
  case'palm':g.lineWidth=thin;g.moveTo(0,0);g.lineTo(L*1.2,0);g.stroke();g.beginPath();g.lineWidth=Math.max(1.2,W*.22);g.lineCap='round';
    for(let i=1;i<=8;i++){const x=L*1.2*i/9,ln=W*1.6*(1-i/12);g.moveTo(x,0);g.lineTo(x+ln*.8,-ln*.6);g.moveTo(x,0);g.lineTo(x+ln*.8,ln*.6);}g.stroke();return;
  case'monstera':g.lineWidth=thin;g.moveTo(0,0);g.lineTo(L*.25,0);g.stroke();g.beginPath();
    for(const a of[-.95,-.48,0,.48,.95])g.ellipse(L*.3+Math.cos(a)*L*.36,Math.sin(a)*L*.36,L*.32,W*.32,a,0,7);circ(g,L*.28,0,W*.55);g.fill();return;
  default:g.moveTo(0,0);g.quadraticCurveTo(L*.5,-W*1.1,L,0);g.quadraticCurveTo(L*.5,W*1.1,0,0);g.fill();}
  g.strokeStyle='rgba(255,255,255,.28)';g.lineWidth=Math.max(.6,L*.04);g.beginPath();g.moveTo(L*.08,0);g.lineTo(L*.85,0);g.stroke();}

function trackPlay(dt){if(document.hidden)return;state.stats.playSecs+=Math.min(dt,10);const d=new Date();const key=`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
  if(state.stats.lastDay!==key){state.stats.lastDay=key;state.stats.days++;}}
function drawScene(c,B,skyD,phase){const g=c.g;
  if(phase==='back'){if(B.back)B.back(c);}
  else if(phase==='ground'){B.ground?B.ground(c):BGS.meadow.ground(c);if(c.night&&!B.noTint){g.fillStyle='rgba(10,20,45,.45)';g.fillRect(0,c.sy,c.w,c.h);}}
  else if(phase==='front'){if(B.front)B.front(c);}
  else if(phase==='overlay'){if(B.overlay)B.overlay(c);}}

  const c={g,w,h,sy:0,worldH:h,gy:h*0.74,t:0,night:!!d[2],k:w/420*1.6};for(const ph of['back','ground','front'])drawScene(c,B,d,ph);

/* ---------- clan tree and chat ---------- */
let treeDocs=new Map(),chatMsgs=[],clanUnsubs=[],subClanId=null,lastChatSend=0,chatSeenAt=0;
function treeTotal(){let n=0;for(const v of treeDocs.values())n+=v.total;return n;}
function treeLevel(){const T=treeTotal();let n=0;while(n<TREE_MAX&&treeNeed(n+1)<=T)n++;return n;}
function unsubClan(){clanUnsubs.forEach(f=>{try{f();}catch(e){}});clanUnsubs=[];treeDocs=new Map();chatMsgs=[];subClanId=null;clanTreeLv=0;updateUnread();}
function subscribeClan(){if(!online||!db||!state.clan){if(subClanId)unsubClan();return;}if(subClanId===state.clan)return;unsubClan();
  const cid=state.clan;subClanId=cid;
  /* membership may not be saved yet right after joining, so a refused listener retries a few times */
  const watch=(make,next)=>{let tries=0;const go=()=>{clanUnsubs.push(make().onSnapshot(sn=>{tries=0;next(sn);},e=>{if(subClanId!==cid)return;
    if(e&&(e.code==='permission-denied'||e.code==='invalid_argument')&&tries<6){tries++;setTimeout(()=>{if(subClanId===cid)go();},2500);}else dbError(e);}));};go();};
  chatSeenAt=+(localStorage.getItem('leafbloom:read:'+cid)||0);let first=true;
  watch(()=>db.collection(`clans/${cid}/tree`),sn=>{if(subClanId!==cid)return;const m=new Map();
    for(const d of sn.docs){if(!d.exists)continue;const t=+((d.data()||{}).total);if(isFinite(t)&&t>0)m.set(d.id,{total:Math.min(t,1e15)});}
    const mine=(state.treeGiven||{})[cid]||0;if(myId&&mine>((m.get(myId)||{}).total||0))m.set(myId,{total:mine});
    treeDocs=m;const lv=treeLevel();if(lv>clanTreeLv&&!first)toast(`The clan tree grew to level ${lv}.`);first=false;clanTreeLv=lv;renderTreeInfo();});
  let firstChat=true;
  watch(()=>db.collection(`clans/${cid}/msgs`).orderBy('at','desc').limit(60),sn=>{if(subClanId!==cid)return;
    const old=new Set(chatMsgs.map(m=>m.id));
    chatMsgs=sn.docs.filter(d=>d.exists).map(d=>{const v=d.data()||{};return{id:d.id,from:String(v.from||''),name:typeof v.name==='string'?v.name.slice(0,30):'',
      text:typeof v.text==='string'?v.text.slice(0,300):'',at:+v.at||0,kind:['sip','open','cheers'].includes(v.kind)?v.kind:'msg'};}).filter(m=>m.text).sort((a,b)=>a.at-b.at);
    for(const m of chatMsgs)if(m.name&&!names[m.from])names[m.from]=m.name;
    if(!firstChat)for(const m of chatMsgs)if(!old.has(m.id)&&m.from!==myId){const who=names[m.from]||m.name||'Someone';
      if(m.kind!=='msg'){toast(sysText(m,who));if(m.kind==='sip'||m.kind==='cheers')clink=Date.now();}else if($('#p-clan').hidden)toast(`${who}: ${m.text.length>70?m.text.slice(0,70)+'…':m.text}`);}
    firstChat=false;renderChat();renderBottle();updateUnread();});}
function updateUnread(){const tab=document.querySelector('[data-tab="clan"]');if(!tab)return;
  const last=chatMsgs.filter(m=>m.from!==myId).reduce((a,m)=>Math.max(a,m.at),0);
  if(!$('#p-clan').hidden&&last>chatSeenAt){chatSeenAt=last;try{localStorage.setItem('leafbloom:read:'+subClanId,String(last));}catch(e){}}
  tab.textContent=last>chatSeenAt?'Clan •':'Clan';}
function chatTime(ts){const d=new Date(ts),n=new Date();const hm=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  return d.toDateString()===n.toDateString()?hm:`${d.toLocaleDateString([],{month:'short',day:'numeric'})} ${hm}`;}
function renderChat(){const el=$('#chatList');if(!el)return;const near=el.scrollHeight-el.scrollTop-el.clientHeight<60||!el.dataset.ready;
  el.innerHTML=chatMsgs.length?chatMsgs.map(m=>{const me=m.from===myId;if(m.kind!=='msg')return`<div class="sys">${m.kind==='open'?'🍾':m.kind==='cheers'?'🥂':'🥃'} ${esc(sysText(m,me?'You':(names[m.from]||m.name||'Someone')))} <time>${chatTime(m.at)}</time></div>`;return`<div class="msg ${me?'me':''}"><b>${esc(me?'You':(names[m.from]||m.name||'Someone'))}</b><span>${esc(m.text)}</span><time>${chatTime(m.at)}</time></div>`;}).join('')

/* ---------- the clan bottle: everyone shares one; sips and new bottles are chat messages ---------- */
const BOTTLE_SIPS=15,SIP_CD=3*60*1000,CHEERS=['Jó szerencsét!','Egészségedre!','To the next cave!','Cheers!','Lights on, ropes tight!','To whoever carried the rope bag!'];
let clink=0,tipsyUntil=0;
function sysText(m,who){if(m.kind==='sip')return`${who} took a sip of Cave Bitter.`;if(m.kind==='open')return`${who} opened a new bottle.`;return`${who} raised a glass: ${m.text}`;}
function bottleState(){let open=-1;for(let i=chatMsgs.length-1;i>=0;i--)if(chatMsgs[i].kind==='open'){open=i;break;}
  const since=chatMsgs.slice(open+1),sips=since.filter(m=>m.kind==='sip').length,now=Date.now();
  const recent=[...new Set(chatMsgs.filter(m=>m.kind==='sip'&&now-m.at<30*60*1000).map(m=>m.from))];
  return{left:Math.max(0,BOTTLE_SIPS-sips),recent};}
function lastSipAt(){try{return+(localStorage.getItem('leafbloom:sip:'+myId)||0);}catch(e){return 0;}}
function renderBottle(){const cv=$('#bottleCv');if(!cv)return;const b=bottleState(),cd=lastSipAt()+SIP_CD-Date.now();
  $('#bottleNote').textContent=b.left?`${b.left} of ${BOTTLE_SIPS} sips left in the bottle.`:'The bottle is empty.';
  const sb=$('#sipBtn');if(b.left){sb.textContent=cd>0?`Next sip in ${mins(cd)} min`:'Take a sip';sb.disabled=cd>0||!online;sb.dataset.open='';}

function drawBottle(t){const cv=$('#bottleCv');if(!cv)return;const{g,w,h}=fit(cv);g.clearRect(0,0,w,h);const left=bottleState().left/BOTTLE_SIPS;
  const cx=w/2,bw=w*0.46,top=h*0.2,neckW=w*0.16,base=h*0.96,sh=h*0.34,wob=Date.now()-clink<1500?Math.sin(t*0.03)*0.06*(1-(Date.now()-clink)/1500):0;

    g.quadraticCurveTo(cx-bw/2,base,cx-bw/2+6,base);g.lineTo(cx+bw/2-6,base);g.quadraticCurveTo(cx+bw/2,base,cx+bw/2,base-6);g.lineTo(cx+bw/2,sh+h*0.08);
    g.quadraticCurveTo(cx+bw/2,sh,cx+neckW/2,sh-h*0.04);g.lineTo(cx+neckW/2,top);g.closePath();};

  g.save();body();g.clip();const fillTop=base-(base-sh)*left*1.02;const lg=g.createLinearGradient(0,fillTop,0,base);lg.addColorStop(0,'#5A2E12');lg.addColorStop(1,'#2A1206');
  g.fillStyle=lg;g.fillRect(0,fillTop+Math.sin(t*0.004)*1.5,w,h);g.fillStyle='rgba(255,255,255,.18)';g.fillRect(cx-bw/2+5,top,4,h);g.restore();
  body();g.strokeStyle='rgba(30,20,10,.75)';g.lineWidth=2;g.stroke();
  g.fillStyle='#8A5A2B';g.fillRect(cx-neckW/2-2,top-h*0.06,neckW+4,h*0.07);g.fillStyle='#C9822A';g.fillRect(cx-neckW/2-3,top-h*0.015,neckW+6,h*0.03);
  const ly=sh+h*0.16,lh=h*0.24;g.fillStyle='#EFE3C6';g.fillRect(cx-bw/2+4,ly,bw-8,lh);g.strokeStyle='#C9822A';g.lineWidth=1.5;g.strokeRect(cx-bw/2+7,ly+3,bw-14,lh-6);
  g.fillStyle='#2A1A10';g.beginPath();const by=ly+lh*0.3,bs=bw*0.13;g.moveTo(cx,by+bs*0.25);g.quadraticCurveTo(cx-bs*0.9,by-bs*0.6,cx-bs*2,by-bs*0.1);g.quadraticCurveTo(cx-bs*1.4,by+bs*0.1,cx-bs*1.3,by+bs*0.5);
  g.quadraticCurveTo(cx-bs*0.7,by+bs*0.1,cx,by+bs*0.55);g.quadraticCurveTo(cx+bs*0.7,by+bs*0.1,cx+bs*1.3,by+bs*0.5);g.quadraticCurveTo(cx+bs*1.4,by+bs*0.1,cx+bs*2,by-bs*0.1);
  g.quadraticCurveTo(cx+bs*0.9,by-bs*0.6,cx,by+bs*0.25);g.fill();g.font=`700 ${Math.max(6,bw*0.15)}px Karla,sans-serif`;g.textAlign='center';g.fillText('CAVE',cx,ly+lh*0.74);g.fillText('BITTER',cx,ly+lh*0.9);
  g.restore();}

function renderTreeInfo(){const bar=$('#treeBar');if(!bar)return;const T=treeTotal(),lv=clanTreeLv,max=lv>=TREE_MAX;

  h+=`</div><h2>Achievements</h2><p class="note">${Object.keys(state.ach).length} of ${ACH.length} done.</p><div id="achList">${achHtml()}</div>`;
  $('#p-look').innerHTML=h;buildIcons();
  document.querySelectorAll('canvas[data-bgthumb]').forEach(cv=>{const k=cv.dataset.bgthumb;if(bgUnlocked(k))bgThumb(cv,k);else{const g=cv.getContext('2d');g.fillStyle='#9AA79F';g.fillRect(0,0,cv.width,cv.height);g.fillStyle='#fff';g.font='700 44px Karla,sans-serif';g.textAlign='center';g.fillText('?',cv.width/2,cv.height/2+15);}});}
function achHtml(){return ACH.map(a=>{const done=!!state.ach[a.k],v=Math.min(a.goal,a.v(state)),fmtv=x=>a.unit==='h'?(x<10?x.toFixed(1):Math.floor(x)):Math.floor(x);
  return`<div class="ach ${done?'done':''}"><div class="txt"><b>${done?'✓ ':''}${esc(a.name)}</b><p>${esc(a.desc)}${a.bg?`. Unlocks the ${esc(BGS[a.bg].name.toLowerCase())} background`:''}.</p>
    ${done?'':`<div class="prog small"><i style="width:${(v/a.goal*100).toFixed(1)}%"></i></div><p>${fmtv(v)} of ${a.goal}${a.unit?' '+a.unit:''}</p>`}</div></div>`;}).join('');}
function buildIcons(){document.querySelectorAll('canvas[data-icon]').forEach(c=>{const[cat,k]=c.dataset.icon.split(':');const g=c.getContext('2d');const S=c.width;g.clearRect(0,0,S,S);
  g.save();g.scale(S/56,S/56);g.translate(28,28);
  if(cat==='leaf'){const L=['willow','palm'].includes(k)?26:['clover','needle'].includes(k)?36:38;g.rotate(-Math.PI/4);g.translate(-L*0.5,0);drawLeaf(g,k,L,STEMS[state.stem].leaf[0]);}
  else if(cat==='gift'){if(k==='bug')drawBug(g,17);else if(k==='bee'){g.translate(-2,5);drawBee(g,16,0);}else if(k==='worm'){g.translate(0,24);drawWorm(g,44,9,0,0);}
    else if(k==='firefly'){const gr=g.createRadialGradient(0,0,0,0,0,24);gr.addColorStop(0,'rgba(220,255,120,.95)');gr.addColorStop(1,'rgba(220,255,120,0)');g.fillStyle=gr;g.beginPath();g.arc(0,0,24,0,7);g.fill();
      g.fillStyle='#3A3A2A';g.beginPath();g.ellipse(-4,0,9,5,0,0,7);g.fill();g.fillStyle='#F6FF9E';g.beginPath();g.ellipse(6,0,7,6,0,0,7);g.fill();}
    else if(k==='cloud'){g.fillStyle='rgba(120,180,240,.9)';for(const dx of[-9,0,9]){g.beginPath();g.ellipse(dx,14,2,5,0,0,7);g.fill();}
      g.fillStyle='#E9F1F8';g.beginPath();g.ellipse(0,-2,20,9,0,0,7);g.ellipse(-10,0,11,8,0,0,7);g.ellipse(9,-6,12,10,0,0,7);g.fill();}
    else{g.fillStyle='#6B4A2F';g.beginPath();g.ellipse(0,8,22,12,0,Math.PI,0);g.fill();g.fillStyle='#4E3522';for(const[x,y]of[[-8,2],[4,-1],[10,4],[-2,6]]){g.beginPath();g.arc(x,y,3,0,7);g.fill();}
      g.fillStyle='#6DBB55';g.beginPath();g.ellipse(-4,-6,7,3,-0.6,0,7);g.ellipse(5,-7,7,3,0.6,0,7);g.fill();}}
  else drawFlower(g,k,18,PETALS[state.petal].c,state.petal==='sun');g.restore();});}
function buildAscend(){const can=state.level>=ascAt(),gain=seedsFor(state.level);
  let h=`<h2>Ascend</h2><p class="note">At level ${ascAt()} your plant can scatter seeds. The current section stops growing and keeps its look forever, and a new section grows on top of it with whatever look you pick next. Levels and sap reset, and each ascension needs a few more levels than the last. You keep leaves, looks, your clan and seed upgrades. Every seed you have ever earned adds 8% to growth and sap.</p>
  <div class="prog"><i style="width:${Math.min(100,(state.level/ascAt())*100)}%"></i></div>
  <p class="note">${can?`Ascending now gives <b class="seed">${gain} seeds</b>. Higher levels give more.`:`Reach level ${ascAt()} to ascend. You are level ${state.level}.`}</p>
  <button class="ascend-btn" id="ascBtn" ${can?'':'disabled'}>${can?`Ascend for ${gain} seeds`:`Locked until level ${ascAt()}`}</button><h2>Mutations</h2><p class="note">Each ascension has a ${Math.round(mutChance()*100)}% chance that the new section mutates. The chance rises every time you miss.</p>
  <div class="mutlist">${Object.keys(MUTS).map(k=>state.mutSeen.includes(k)?`<span>${MUTS[k].name}</span>`:`<span class="no">Not found yet</span>`).join('')}</div>
  <p class="note">Found ${state.mutSeen.length} of ${Object.keys(MUTS).length}.${state.mut?` Your growing section is ${MUTS[state.mut].name.toLowerCase()}.`:''}</p>
  <h2>Seed upgrades</h2>`;
  for(const k in PERMS){const p=PERMS[k],l=state.perm[k],max=l>=p.max;
    h+=`<div class="row"><div class="txt"><b>${p.name}</b><span class="lv">Lv ${l}</span><p>${p.eff(l)}</p></div>
      <button class="buy" data-perm="${k}" ${max?'disabled':''}>${max?'Maxed':`<span class="seed">${p.cost(l)}</span> seeds`}</button></div>`;}
  h+=`<p class="note" style="margin-top:10px">Ascended ${state.asc} time${state.asc===1?'':'s'}. Seeds earned in total: ${state.seedsTotal}. Best level: ${state.best}.</p>`;
  $('#p-ascend').innerHTML=h;ascArm=0;}
let ascArm=0;
function ascend(){if(state.level<ascAt())return;if(Date.now()-ascArm>4000){ascArm=Date.now();$('#ascBtn').textContent='Tap again to ascend';return;}
  const gain=seedsFor(state.level);state.tiers.push({leaf:state.leaf,stem:state.stem,flower:state.flower,petal:state.petal,level:state.level,mut:state.mut});state.mut=rollMutation();if(state.mut&&!state.mutSeen.includes(state.mut))state.mutSeen.push(state.mut);state.seeds+=gain;state.seedsTotal+=gain;state.asc++;
  Object.assign(state,{level:1,xp:0,sap:0,moisture:100});state.up={roots:2*state.perm.deep,leaves:0,res:0,bloom:0};if(state.found.compost)addStock('compost');
  toast(`This section rests at level ${state.tiers[state.tiers.length-1].level}. New growth starts on top. +${gain} seeds.`);if(state.mut)setTimeout(()=>toast(`A mutation! Your new growth is ${MUTS[state.mut].name.toLowerCase()}: ${MUTS[state.mut].desc}.`),900);wantFocus=true;checkFinds();buildAll();saveSoon();publishGarden();}
function buildAll(){buildGrow();buildLook();buildAscend();buildClan();refresh();}
function refresh(){const now=Date.now(),r=rates(state,now),n=need(state.level),mp=myPlant(),gl=giftList({id:myId||'me'});
  $('#pname').textContent=state.plantName;
  $('#stageName').textContent=`${stageName(state.level)}${state.mut?`, ${MUTS[state.mut].name.toLowerCase()}`:''}${gl?`, ${gl}`:''}${sunFactor(now)<1?', resting for the night':''}`;
  $('#sLevel').textContent=state.level;$('#sXpRate').textContent=`${fmt(r.xp*3600)} growth/h`;
  $('#sSap').textContent=fmt(state.sap);$('#sSapRate').textContent=`+${fmt(r.sap*3600)}/h`;
  $('#sSeeds').textContent=state.seeds;$('#sAsc').textContent=state.asc?`Ascended ${state.asc}×`:'Not ascended';
  $('#moistBar').style.width=state.moisture+'%';$('#moistTxt').textContent=state.moisture<=0?'Soil is dry, growth is slow':`Soil ${Math.round(state.moisture)}%`;
  $('#xpBar').style.width=Math.min(100,state.xp/n*100)+'%';$('#xpTxt').textContent=`Level ${state.level+1} in about ${dur((n-state.xp)/Math.max(1e-9,r.xp))} at this pace`;
  const net=r.rain-r.drain,rn=$('#rateNote');if(rn)rn.textContent=net<0?`A full watering lasts about ${dur(100/-net)}. Dry soil grows at a fraction of the speed, and nights are slower.`:'Rain keeps your soil wet on its own.';
  document.querySelectorAll('[data-buy]').forEach(b=>{const k=b.dataset.buy;if(state.up[k]<UPG[k].max)b.disabled=state.sap<upCost(k);});
  document.querySelectorAll('[data-perm]').forEach(b=>{const k=b.dataset.perm;if(state.perm[k]<PERMS[k].max)b.disabled=state.seeds<PERMS[k].cost(state.perm[k]);});
  const ab=$('#ascBtn');if(ab&&(state.level>=ascAt())===ab.disabled)buildAscend();}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.id==='waterBtn')return water();
  if(b.id==='jumpBtn')return;
  if(b.id==='ascBtn')return ascend();
  if(b.id==='waterOther')return waterOther();
  if(b.id==='createClan')return createClan();
  if(b.id==='leaveClan')return leaveClan();
  if(b.id==='chatSend')return sendChat();
  if(b.id==='sipBtn')return sip();
  if(b.id==='cheersBtn')return cheers();
  if(b.dataset.donate)return donate(+b.dataset.donate);
  if(b.dataset.join)return joinClan(b.dataset.join);
  if(b.dataset.gift)return sendGift(b.dataset.gift,b.dataset.to);
  if(b.dataset.recall)return recallGift(b.dataset.recall);
  if(b.dataset.home)return sendHome(b.dataset.home);
  if(b.dataset.gfilter){gFilter=b.dataset.gfilter;if(gFilter==='clan'&&!state.clan)toast('Join a clan in the Clan tab first.');
    document.querySelectorAll('[data-gfilter]').forEach(x=>x.setAttribute('aria-pressed',x===b));return;}
  if(b.dataset.tab){document.querySelectorAll('[data-tab]').forEach(t=>t.setAttribute('aria-selected',t===b));
    for(const p of ['grow','look','ascend','garden','clan'])$('#p-'+p).hidden=p!==b.dataset.tab;
    if(b.dataset.tab==='garden')renderCard();if(b.dataset.tab==='clan'){buildClan();updateUnread();}return;}
  if(b.dataset.buy){const k=b.dataset.buy,c=upCost(k);if(state.sap>=c&&state.up[k]<UPG[k].max){state.sap-=c;state.up[k]++;buildGrow();refresh();saveSoon();}return;}
  if(b.dataset.perm){const k=b.dataset.perm,c=PERMS[k].cost(state.perm[k]);if(state.seeds>=c&&state.perm[k]<PERMS[k].max){state.seeds-=c;state.perm[k]++;buildAscend();refresh();saveSoon();}return;}
  if(b.dataset.leaf){const k=b.dataset.leaf;if(!has(LEAVES,k))return;if(!state.owned.leaf.includes(k)){if(state.asc<LEAVES[k].life){toast(`${LEAVES[k].name} leaves open up after ${LEAVES[k].life} ascension${LEAVES[k].life>1?'s':''}.`);return;}const c=leafCost(k);if(state.sap<c){toast(`${LEAVES[k].name} leaves cost ${fmt(c)} sap.`);return;}
      state.sap-=c;state.owned.leaf.push(k);state.leavesBought++;toast(`Unlocked ${LEAVES[k].name.toLowerCase()} leaves.`);}
    state.leaf=k;buildLook();refresh();saveSoon();maybePublish();return;}
  if(b.dataset.bg){const k=b.dataset.bg;if(!bgUnlocked(k)){const a=ACH.find(x=>x.bg===k);toast(`Unlocked by the achievement “${a?a.name:''}”: ${a?a.desc.toLowerCase():''}.`);return;}
    state.bg=k;saveSoon();buildLook();return;}
  if(b.dataset.cos){const cat=b.dataset.cos,k=b.dataset.key,it=COSMETICS[cat][k];if(!state.owned[cat].includes(k)){if(state.seeds<it.cost){toast(`${it.name} costs ${it.cost} seeds.`);return;}
      state.seeds-=it.cost;state.owned[cat].push(k);}
    state[cat]=k;buildLook();refresh();saveSoon();maybePublish();}});
document.addEventListener('change',e=>{if(e.target.id==='nameIn'){state.plantName=e.target.value.trim().slice(0,18)||'Sprout';e.target.value=state.plantName;refresh();saveSoon();maybePublish();}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='clanName')createClan();if(e.key==='Enter'&&e.target.id==='chatIn'){e.preventDefault();sendChat();}});
$('#hero').addEventListener('click',water);
$('#jumpBtn').addEventListener('click',e=>{e.stopPropagation();focusGrowth(true);});
window.addEventListener('resize',()=>{wantFocus=true;});
$('#garden').addEventListener('click',e=>{const r=e.currentTarget.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;
  const c=gardenCells.find(c=>x>=c.x&&x<c.x+c.w&&y>=c.y&&y<c.y+c.h);selected=c?c.id:null;renderCard();});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{gardenColors=null;});

/* ---------- loops ---------- */
let lastHelperTick=Date.now(),lastRemote=Date.now(),lastPubBeat=Date.now(),lastLocal=Date.now(),lastCard=0;
function tick(){const now=Date.now();let dt=(now-state.ts)/1000;if(dt>30){catchUp(true);}else if(dt>0){const ups=step(state,dt,now);state.ts=now;
    if(ups){toast(`${state.plantName} reached level ${state.level}.`);buildGrow();buildAscend();maybePublish();}}
  if(now-lastHelperTick>5000){trackPlay((now-lastHelperTick)/1000);lastHelperTick=now;checkAch();regenStock(now);checkFinds();if(state.visitors.some(v=>v.until<=now))processIncoming();}
  refresh();if(now-lastLocal>5000){lastLocal=now;saveLocal();}
  if(now-lastRemote>60000){lastRemote=now;saveRemote();}
  if(now-lastPubBeat>120000){lastPubBeat=now;publishGarden();}
  if(now-lastCard>15000){lastCard=now;if(!$('#p-garden').hidden)renderCard();if(!$('#p-clan').hidden){refreshClanButtons();renderBottle();}}}
function refreshClanButtons(){document.querySelectorAll('.gifts').forEach(gd=>{const b=gd.querySelector('[data-to]');if(b)gd.outerHTML=helperButtons(b.dataset.to);});
  const hb=$('#helpersBox');if(hb)hb.outerHTML=helpersHtml();buildIcons();renderTreeInfo();}
function frame(t){if(!document.hidden){drawHero(t);if(!$('#p-garden').hidden)drawGarden(t);if(!$('#p-clan').hidden){drawClanTree(t);drawBottle(t);}}requestAnimationFrame(frame);}
document.addEventListener('visibilitychange',()=>{if(document.hidden){saveLocal();saveRemote();publishGarden();}else{publishGarden();tick();}});
window.addEventListener('pagehide',saveLocal);

/* ---------- Firebase ---------- */
// The Firebase config lives in firebase-config.js next to this file.
let firebaseConfig=null;
const PREFIX='lb_'; // all collections start with lb_, so this can share a project with other games
let auth=null,unsubs=[];
function makeDb(fs){
  const wrap=d=>({id:d.id,exists:d.exists(),data:()=>d.data()});
  const q=ref=>({where:(f,op,v)=>q(query(ref,fwhere(f,op,v))),orderBy:(f,d)=>q(query(ref,forder(f,d))),limit:n=>q(query(ref,flimit(n))),onSnapshot:(next,err)=>fsnap(ref,sn=>next({docs:sn.docs.map(wrap)}),err)});
  return{doc:p=>{const r=fdoc(fs,PREFIX+p);return{set:data=>setDoc(r,data),del:()=>fdel(r),get:async()=>wrap(await getDoc(r))};},collection:p=>q(fcol(fs,PREFIX+p))};}
async function signIn(){const pr=new GoogleAuthProvider();
  try{await signInWithPopup(auth,pr);}catch(e){if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'))await signInWithRedirect(auth,pr);
    else if(e&&e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')toast('Sign-in failed: '+(e.code||'unknown error'));}}
function disconnect(){sentDocs=new Map();incomingDocs=new Map();unsubClan();unsubs.forEach(f=>{try{f();}catch(e){}});unsubs=[];if(online){saveLocal();}online=false;myId=null;myName='';players=new Map();clans=new Map();clansLoaded=false;
  $('#gardenNote').textContent='Sign in with Google to share a garden. Until then your plant lives on this device.';setStatus();buildClan();}
async function connect(u){saveHold=true;disconnect();myId=u.uid;myName=(u.displayName||'').trim().split(/\s+/)[0].slice(0,30)||'Gardener';
  $('#gardenNote').textContent='Everyone’s plants grow here. Tap one to visit it.';
  const mine=loadLocal();let remote=null;
  try{const sn=await db.doc(`saves/${myId}`).get();if(sn.exists)remote=sn.data();}catch(e){dbError(e);}
  if(myId!==u.uid)return;
  /* The account's save (from the server, or this device's copy of it) always wins; the newer of the two is used.
     The plant grown before signing in only moves to the account the very first time, when the account has no save yet. */
  const cands=[remote,loadLocal()||mine].filter(Boolean).map(normalize);cands.sort((a,b)=>(b.ts||0)-(a.ts||0));
  state=cands.length?cands[0]:normalize(state);saveHold=false;try{localStorage.setItem('leafbloom:lastUid',myId);}catch(e){}online=true;catchUp(true);regenStock(Date.now());checkFinds();wantFocus=true;buildAll();setStatus();saveLocal();
  unsubs.push(db.collection('garden').onSnapshot(sn=>{players=new Map();for(const d of sn.docs){if(d.exists)players.set(d.id,cleanPlant(d.id,d.data()||{}));}
    for(const [id,p] of players)names[id]=p.owner||names[id]||'';setStatus();renderCard();clanSoon();},e=>dbError(e)));
  unsubs.push(db.collection('clans').onSnapshot(sn=>{clans=new Map();for(const d of sn.docs){if(!d.exists)continue;const v=d.data()||{};
      const nm=typeof v.name==='string'?v.name.trim().slice(0,24):'';if(nm)clans.set(d.id,{name:nm,by:String(v.by||''),at:+v.at||0});}
    clansLoaded=true;clanSoon();},e=>dbError(e)));
  unsubs.push(db.collection('drops').where('to','==',myId).onSnapshot(handleDrops,e=>dbError(e)));
  unsubs.push(db.collection('gifts').where('to','==',myId).onSnapshot(handleIncoming,e=>dbError(e)));
  unsubs.push(db.collection('gifts').where('from','==',myId).onSnapshot(handleSent,e=>dbError(e)));
  subscribeClan();lastPub='';publishGarden();saveRemote();}

/* ---------- boot ---------- */
let clanTimer=null;function clanSoon(){clearTimeout(clanTimer);clanTimer=setTimeout(()=>{if(!$('#p-clan').hidden)buildClan();},300);}
$('#authBtn').addEventListener('click',async()=>{if(!auth)return;if(myId){saveLocal();await saveRemote();await signOut(auth);}else signIn();});
async function boot(){
  /* show the last signed-in player's plant right away (from this device), so nothing jumps while signing in */
  let lastUid=null;try{lastUid=localStorage.getItem('leafbloom:lastUid');}catch(e){}
  const cached=lastUid?(()=>{try{const v=localStorage.getItem('leafbloom:'+lastUid);return v?JSON.parse(v):null;}catch(e){return null;}})():null;
  const solo=()=>{saveHold=false;myId=null;const l=loadLocal();state=normalize(l);catchUp(true);buildAll();setStatus();};
  if(cached){saveHold=true;state=normalize(cached);C_quietCatch();$('#statusTxt').textContent='Loading your plant…';}else{const local=loadLocal();if(local)state=normalize(local);catchUp(true);}
  buildAll();if(!cached)setStatus();
  setInterval(tick,250);requestAnimationFrame(frame);
  try{({firebaseConfig}=await import('./firebase-config.js'));}catch(e){console.warn('No firebase-config.js',e);}
  if(!firebaseConfig||!firebaseConfig.apiKey||String(firebaseConfig.apiKey).startsWith('PASTE')){if(cached)solo();$('#gardenNote').textContent='Fill in firebase-config.js to share a garden. For now your plant lives on this device.';return;}
  try{const[A,U,F]=await Promise.all([import(FB+'firebase-app.js'),import(FB+'firebase-auth.js'),import(FB+'firebase-firestore.js')]);
    ({initializeApp}=A);({getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut}=U);
    ({getFirestore,setDoc,getDoc,query,doc:fdoc,collection:fcol,where:fwhere,onSnapshot:fsnap,orderBy:forder,limit:flimit,deleteDoc:fdel}=F);}
  catch(e){console.warn('Firebase failed to load',e);if(cached)solo();$('#gardenNote').textContent='Could not reach Firebase. Your plant lives on this device until the connection works.';return;}
  const app=initializeApp(firebaseConfig);auth=getAuth(app);db=makeDb(getFirestore(app));setStatus();
  onAuthStateChanged(auth,u=>{if(u){if(myId!==u.uid||saveHold)connect(u);}else{disconnect();try{localStorage.removeItem('leafbloom:lastUid');}catch(e){}solo();}});}
boot();
</script>
